http {
   # Настройка upstream для балансировки нагрузки
   upstream backend_servers {
       server backend1.example.com;
       server backend2.example.com;
       server backend3.example.com;
   }

   # Определение лимита запросов
   limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

   server {
       listen 80;

       location / {
           # Применение лимита запросов
           limit_req zone=partner_limit burst=5 nodelay;

           proxy_pass http://backend_servers;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header Host $host;

           # Кеширование ответа 429, чтобы снизить нагрузку при частых запросах
           error_page 429 = /429.html;
       }

       location = /429.html {
           return 429 "Too Many Requests - Please slow down.";
       }
   }
}
